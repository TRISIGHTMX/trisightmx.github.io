<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset='UTF-8'>

    <title>TRISIGHTᵐˣ - Links</title>

    <link rel="shortcut icon" type="image/x-icon" href="/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#ffffff">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 17px;
            overflow-x: hidden;
            color: #fff;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 0;
        }

        #bg-video {
            position: fixed;
            left: 50%;
            top: 50%;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            transform: translate(-50%, -50%);
            z-index: -1;
        }

        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 600px;
            width: 100%;
        }

        #logo {
            max-width: 300px;
            height: auto;
            margin-bottom: 40px;
            opacity: 0.8;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }

        .link-item {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 15px 20px;
            text-decoration: none;
            color: #fff;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .link-item:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .link-item .title {
            font-size: 18px;
            margin-bottom: 5px;
            display: block;
        }

        .link-item .description {
            font-size: 14px;
            opacity: 0.8;
            display: block;
        }

        .back-home {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            padding: 12px;
            text-decoration: none;
            color: #fff;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-home:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        @media (max-width: 480px) {
            .content {
                padding: 0 20px;
            }
            
            .link-item {
                padding: 12px 16px;
            }
            
            .link-item .title {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <video autoplay loop muted id="bg-video">
        <source src="/memetic-storm-bw.mp4" type="video/mp4">
        <img src="/trisight-fallback.png" alt="Background image">
    </video>

    <a href="/" class="back-home" title="Back to Home">
        ←
    </a>

    <div class="content">
        <img src="/trisight-brand-logo.png" alt="Trisight Logo" id="logo">
        
        <div class="links-container">
            <a href="https://x.com/mothnode" target="_blank" rel="noopener noreferrer" class="link-item">
                <span class="title">X / Twitter</span>
                <span class="description">@mothnode - Follow our journey</span>
            </a>
            
            <a href="https://instagram.com/mothnode" target="_blank" rel="noopener noreferrer" class="link-item">
                <span class="title">Instagram</span>
                <span class="description">Visual experiences and behind the scenes</span>
            </a>
            
            <a href="https://youtube.com/@mothnode" target="_blank" rel="noopener noreferrer" class="link-item">
                <span class="title">YouTube</span>
                <span class="description">Video content and documentaries</span>
            </a>
            
            <a href="https://soundcloud.com/mothnode" target="_blank" rel="noopener noreferrer" class="link-item">
                <span class="title">SoundCloud</span>
                <span class="description">Audio experiments and mixes</span>
            </a>
            
            <a href="https://github.com/mothnode" target="_blank" rel="noopener noreferrer" class="link-item">
                <span class="title">GitHub</span>
                <span class="description">Open source projects and code</span>
            </a>
            
            <a href="mailto:contact@trisight.mx" class="link-item">
                <span class="title">Contact</span>
                <span class="description">Get in touch for collaborations</span>
            </a>
        </div>
    </div>

</body>
</html>
