    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 17px;
            overflow-x: hidden;
            color: #fff;
            background-color: #000;
            cursor: crosshair;
            position: relative;
        }

        /* Top radial blur overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 30vh;
            background: radial-gradient(ellipse 70% 100% at center top, 
                                      rgba(0, 0, 0, 0.6) 0%, 
                                      rgba(0, 0, 0, 0.3) 40%, 
                                      transparent 80%);
            z-index: 5;
            pointer-events: none;
        }

        /* Navigation Header */
        .nav-header {
            position: fixed;
            top: 5vh;
            left: 0;
            right: 0;
            z-index: 10;
            background: transparent;
            padding: 20px 0;
        }

        .nav-container {
            display: flex;
            justify-content: center;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .nav-links {
            display: flex;
            align-items: flex-start;
            gap: 40px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-link {
            text-decoration: none;
            color: #fff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
            opacity: 0.7;
            transition: all 0.3s ease;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-transform: uppercase;
        }

        .nav-link:hover {
            opacity: 1;
            transform: translateY(-1px);
        }

        .nav-link.active {
            opacity: 1;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8),
                         0 0 20px rgba(255, 255, 255, 0.6),
                         0 0 30px rgba(255, 255, 255, 0.4);
        }

        .nav-link .sub-text {
            font-size: 10px;
            opacity: 0.6;
            margin-top: 4px;
            font-weight: 400;
            letter-spacing: 0.3px;
            text-transform: none;
            position: absolute;
            top: 100%;
            white-space: nowrap;
        }

        .nav-link.active .sub-text {
            opacity: 0.8;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        /* Hover text that appears above certain nav items */
        .nav-link.has-hover-text::before {
            content: '⛬TRISIGHT';
            font-size: 10px;
            opacity: 0;
            font-weight: 400;
            letter-spacing: 0.3px;
            text-transform: none;
            position: absolute;
            bottom: 100%;
            margin-bottom: 4px;
            white-space: nowrap;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .nav-link.has-hover-text:hover::before {
            opacity: 0.6;
        }

        /* Active status indicator for Status Board */
        .nav-link .active-status {
            position: absolute;
            top: 100%;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .nav-link .active-status-dot {
            width: 6px;
            height: 6px;
            background: #80FCFF;
            border-radius: 50%;
            box-shadow: 0 0 8px #80FCFF, 0 0 16px #80FCFF;
            animation: blink 1.5s infinite;
        }

        .nav-link .active-status-text {
            color: #80FCFF;
            font-size: 10px;
            font-weight: 600;
            text-shadow: 0 0 10px #80FCFF;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            opacity: 0.8;
        }

        #bg-video {
            position: fixed;
            left: 50%;
            top: 50%;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            transform: translate(-50%, -50%);
            z-index: -1;
            opacity: 0.4;
            filter: blur(10px) contrast(0.7);
        }

        .hero-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 20px 40px 20px;
            text-align: center;
            position: relative;
            z-index: 1;
            margin-top: 100px;
        }

        .hero-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .profile-section {
            margin-bottom: 30px;
        }

        .profile-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin-bottom: 20px;
        }

        .profile-symbol {
            font-size: 24px;
            margin-bottom: 10px;
            opacity: 0.8;
        }

        .profile-title {
            font-size: 16px;
            margin-bottom: 25px;
            opacity: 0.9;
            font-style: italic;
        }

        .social-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 30px;
        }

        .social-link {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 15px 20px;
            text-decoration: none;
            color: #fff;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-weight: 500;
            font-size: 16px;
            min-height: 50px;
        }

        .social-link:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .hero-title-section {
            margin: 30px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .separator {
            width: 60%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            margin: 20px 0;
            max-width: 360px;
        }

        .brand-logo-link {
            display: inline-block;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .brand-logo {
            height: 72px;
            width: auto;
            margin-bottom: 15px;
            opacity: 0.9;
            filter: brightness(1.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .brand-logo-link:hover .brand-logo {
            filter: brightness(1.3) drop-shadow(0 0 20px rgba(255, 255, 255, 0.8));
            transform: translateY(-2px);
        }

        .main-description {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 0;
            text-align: center;
            font-style: italic;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }

        @media (max-width: 768px) {
            .nav-header {
                top: 3vh;
            }
            
            .nav-links {
                gap: 25px;
            }
            
            .nav-link {
                font-size: 12px;
            }

            .hero-section {
                margin-top: 80px;
                padding: 20px 15px 40px 15px;
            }

            .social-grid {
                grid-template-columns: repeat(2, 1fr);
                max-width: 400px;
            }

            .brand-logo {
                height: 60px;
            }
        }

        @media (max-width: 480px) {
            .nav-header {
                top: 1vh;
            }
            
            .nav-container {
                padding: 0 15px;
            }
            
            .nav-links {
                gap: 15px;
            }
            
            .nav-link {
                font-size: 11px;
            }
            
            .nav-link .sub-text {
                font-size: 9px;
            }
            
            .nav-link.has-hover-text::before {
                font-size: 9px;
            }

            .nav-link .active-status-text {
                font-size: 9px;
            }
            
            .nav-link .active-status-dot {
                width: 5px;
                height: 5px;
            }

            .hero-section {
                margin-top: 60px;
                padding: 20px 15px 40px 15px;
            }

            .social-grid {
                grid-template-columns: 1fr;
                max-width: 300px;
            }

            .brand-logo {
                height: 48px;
            }
        }
    </style>
</head>
