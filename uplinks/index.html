  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Helvetica, Arial, sans-serif;
      font-size: 17px;
      color: #fff;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 20px;
      text-align: center;
    }

    #bg-video {
      position: fixed;
      top: 50%; left: 50%;

      object-fit: cover;
      transform: translate(-50%, -50%);
      z-index: -1;
      opacity: 0.4;
      filter: blur(10px) contrast(0.7);
    }

    .content {
      position: relative;
      z-index: 1;
      max-width: 600px;
      width: 100%;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    /* Profile */
    .profile-image {
      width: 120px; height: 120px;
      border-radius: 50%;
      margin-bottom: 20px;
    }
    .profile-symbol { font-size: 24px; opacity: 0.8; }
    .profile-title {
      font-size: 16px; font-style: italic; opacity: 0.9;
    }

    /* Social icons */
    .social-icons {
      display: flex; gap: 20px; justify-content: center;
    }
    .social-icon {
      width: 40px; height: 40px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 18px;
      transition: 0.3s; backdrop-filter: blur(10px);
      text-decoration: none;
    }
    .social-icon:hover {
      background: rgba(255,255,255,0.2);
      transform: translateY(-2px);
    }

    /* Link cards */
    .links-container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .link-item {
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 15px 20px;
      text-decoration: none;
      color: #fff;
      transition: 0.3s;
      backdrop-filter: blur(10px);
      font-weight: 500;
      font-size: 16px;
      display: block;
      text-align: center;
    }
    .link-item:hover {
      background: rgba(255,255,255,0.2);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .section-header {
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
      opacity: 0.8;
      margin: 30px 0 15px;
    }

    /* Back button */
    .back-home {
      position: fixed;
      top: 20px; left: 20px;
      width: 50px; height: 50px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      color: #fff;
      font-size: 24px; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      transition: 0.3s; backdrop-filter: blur(10px);
      text-decoration: none;
      z-index: 2;
    }
    .back-home:hover {
      background: rgba(255,255,255,0.2);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    /* Scrollbar */
    .content::-webkit-scrollbar { width: 6px; }
    .content::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.1); border-radius: 3px;
    }
    .content::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.3); border-radius: 3px;
    }
    .content::-webkit-scrollbar-thumb:hover {
      background: rgba(255,255,255,0.5);
    }

    @media (max-width: 480px) {
      .content { max-height: calc(100vh - 30px); }
      .social-icons { gap: 15px; }
      .link-item { padding: 12px 16px; }
    }
