<style>
    * {
        box-sizing: border-box;
    }

    html {
        height: 100%;
        overflow: hidden;
    }

    body {
        margin: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 17px;
        overflow: hidden;
        color: #fff;
        background-color: #000;
        cursor: crosshair;
        position: relative;
        height: 100vh;
    }

    /* Top radial blur overlay */
    body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 30vh;
        background: radial-gradient(ellipse 70% 100% at center top, 
                                  rgba(0, 0, 0, 0.6) 0%, 
                                  rgba(0, 0, 0, 0.3) 40%, 
                                  transparent 80%);
        z-index: 5;
        pointer-events: none;
    }

    /* Navigation Header */
    .nav-header {
        position: fixed;
        top: 5vh;
        left: 0;
        right: 0;
        z-index: 10;
        background: transparent;
        padding: 20px 0;
    }

    .nav-container {
        display: flex;
        justify-content: center;
        align-items: center;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
    }

    .nav-links {
        display: flex;
        align-items: flex-start;
        gap: 40px;
        list-style: none;
        margin: 0;
        padding: 0;
    }

    .nav-link {
        text-decoration: none;
        color: #fff;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.5px;
        opacity: 0.7;
        transition: all 0.3s ease;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-transform: uppercase;
    }

    .nav-link:hover {
        opacity: 1;
        transform: translateY(-1px);
    }

    .nav-link.active {
        opacity: 1;
        color: #fff;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.8),
                     0 0 20px rgba(255, 255, 255, 0.6),
                     0 0 30px rgba(255, 255, 255, 0.4);
    }

    .nav-link .sub-text {
        font-size: 10px;
        opacity: 0.6;
        margin-top: 4px;
        font-weight: 400;
        letter-spacing: 0.3px;
        text-transform: none;
        position: absolute;
        top: 100%;
        white-space: nowrap;
    }

    .nav-link.active .sub-text {
        opacity: 0.8;
        text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
    }

    /* Hover text that appears above certain nav items */
    .nav-link.has-hover-text::before {
        content: '⛬TRISIGHT';
        font-size: 10px;
        opacity: 0;
        font-weight: 400;
        letter-spacing: 0.3px;
        text-transform: none;
        position: absolute;
        bottom: 100%;
        margin-bottom: 4px;
        white-space: nowrap;
        transition: opacity 0.3s ease;
        pointer-events: none;
    }

    .nav-link.has-hover-text:hover::before {
        opacity: 0.6;
    }

    /* Active status indicator for Status Board */
    .nav-link .active-status {
        position: absolute;
        top: 100%;
        margin-top: 4px;
        display: flex;
        align-items: center;
        gap: 4px;
        white-space: nowrap;
    }

    .nav-link .active-status-dot {
        width: 6px;
        height: 6px;
        background: #80FCFF;
        border-radius: 50%;
        box-shadow: 0 0 8px #80FCFF, 0 0 16px #80FCFF;
        animation: blink 1.5s infinite;
    }

    .nav-link .active-status-text {
        color: #80FCFF;
        font-size: 10px;
        font-weight: 600;
        text-shadow: 0 0 10px #80FCFF;
        text-transform: uppercase;
        letter-spacing: 0.3px;
        opacity: 0.8;
    }

    #bg-video {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        transform: translate(-50%, -50%);
        z-index: -1;
        opacity: 0.4;
        filter: blur(10px) contrast(0.7);
    }

    .hero-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        padding: 20px;
        text-align: center;
        position: relative;
        z-index: 1;
    }

    .coming-soon-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 30px;
    }

    .coming-soon-text {
        font-size: 80px;
        font-weight: 700;
        letter-spacing: 6px;
        text-transform: uppercase;
        opacity: 0.9;
        animation: glow 2s ease-in-out infinite alternate;
    }

    .network-state-subtitle {
        font-size: 24px;
        font-weight: 500;
        letter-spacing: 2px;
        opacity: 0.7;
        text-transform: uppercase;
        margin-bottom: 20px;
    }

    /* Creative Supremacy styling - modified to match second code's scaled content approach */
    .creative-supremacy-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 16px;
        font-weight: 400;
        color: #fff;
        opacity: 0.8;
        letter-spacing: 0.5px;
        line-height: 1.6;
        word-break: break-word;
        max-width: 600px;
        width: 100%;
        text-align: center;
        transform: scale(0.67); /* Scaled content approach from second code */
        margin-top: 20px;
    }

    @keyframes glow {
        from {
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6),
                         0 0 30px rgba(255, 255, 255, 0.4),
                         0 0 45px rgba(255, 255, 255, 0.2);
        }
        to {
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8),
                         0 0 40px rgba(255, 255, 255, 0.6),
                         0 0 60px rgba(255, 255, 255, 0.4);
        }
    }

    @keyframes blink {
        0%, 50% { opacity: 1; }
        51%, 100% { opacity: 0.3; }
    }

    @media (max-width: 768px) {
        .nav-header {
            top: 3vh;
        }
        
        .nav-links {
            gap: 25px;
        }
        
        .nav-link {
            font-size: 12px;
        }

        .coming-soon-text {
            font-size: 60px;
            letter-spacing: 4px;
        }

        .network-state-subtitle {
            font-size: 20px;
            letter-spacing: 1px;
        }

        .creative-supremacy-text {
            transform: scale(0.85);
            font-size: 16px;
            padding: 0 20px;
        }
    }

    @media (max-width: 480px) {
        .nav-header {
            top: 1vh;
        }
        
        .nav-container {
            padding: 0 15px;
        }
        
        .nav-links {
            gap: 15px;
        }
        
        .nav-link {
            font-size: 11px;
        }
        
        .nav-link .sub-text {
            font-size: 9px;
        }
        
        .nav-link.has-hover-text::before {
            font-size: 9px;
        }

        .nav-link .active-status-text {
            font-size: 9px;
        }
        
        .nav-link .active-status-dot {
            width: 5px;
            height: 5px;
        }

        .coming-soon-text {
            font-size: 40px;
            letter-spacing: 2px;
        }

        .network-state-subtitle {
            font-size: 16px;
            letter-spacing: 0.5px;
        }

        .creative-supremacy-text {
            transform: scale(1);
            font-size: 14px;
        }
    }
</style>
 </head>

            <li><a href="https://trisight.mx/communique/" class="nav-link has-hover-text active">Communique<span class="sub-text">September 2025</span></a></li>

        </ul>

    </div>
</div>
 </body>
